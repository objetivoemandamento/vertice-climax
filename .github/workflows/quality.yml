name: Vértice Climax checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  whatsapp-agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/server.js
          node --check ../business.js
          node --check ../app.js
          node --check src/local-agent.js
          node --check src/mercadopago.js
          node --check src/pix-payment.js
          node --check src/whatsapp-auth-crypto.js
          node --check src/vercel-publish.js
          node --check src/state-protection.js
          node --check src/automation-state.js
          node --check test/local-agent.test.js
          node --check test/mercadopago.test.js
          node --check test/pix-payment.test.js
          node --check test/whatsapp-auth-crypto.test.js
          node --check test/vercel-publish.test.js
          node --check test/state-protection.test.js
          node --check test/automation-state.test.js
          node --check scripts/smoke-test.mjs
      - name: Run local agent unit tests
        run: npm test

      - name: Start isolated WhatsApp service and verify QR
        env:
          PORT: 8787
          DATA_DIR: ${{ runner.temp }}/vertice-whatsapp-qr
        run: |
          export VERTICE_SERVICE_TOKEN="$(node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("hex"))')"
          npm start > "$RUNNER_TEMP/whatsapp-service.log" 2>&1 &
          whatsapp_service_pid=$!
          trap 'kill "$whatsapp_service_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/health >/dev/null; then
              break
            fi
            sleep 1
          done
          npm run smoke
